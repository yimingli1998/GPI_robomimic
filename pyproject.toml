[project]
name = "gpi-robomimic"
version = "0.1.0"
description = "Minimal reproducibility harness for GPI-style RoboMimic Can, Square, and Lift evaluations."
requires-python = ">=3.10,<3.12"
dependencies = [
    "numpy",
]

[project.optional-dependencies]
rollout = [
    "h5py",
    "imageio",
    "numpy",
    "scipy",
    "torch",
    "robomimic @ git+https://github.com/ARISE-Initiative/robomimic.git@v0.5.0",
    "robosuite==1.5.1",
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
gpi-repro = "gpi_repro.run:main"
gpi-download-data = "gpi_repro.data_download:main"
